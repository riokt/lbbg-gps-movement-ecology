[project]
name = "bird-migration-intelligence"
version = "0.1.0"
description = "Reproducible audit of openly downloadable bird tracking data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "geopandas>=1.0,<2",
  "statsmodels>=0.14,<1",
  "jupyterlab>=4,<5",
  "ipykernel>=7,<8",
  "pyarrow>=18,<20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bird_migration"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
